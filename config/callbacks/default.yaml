defaults:
  - model_checkpoint
  - rich_model_summary
  - rich_progress_bar
  - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val_accuracy"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

rich_model_summary:
  max_depth: -1