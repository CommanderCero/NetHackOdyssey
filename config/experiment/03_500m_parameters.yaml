# @package _global_

defaults:
  - override /data: cpc
  # NEW: Use the 500m parameter model instead of our default one which is only 10m parameters
  - override /model: cpc_500m
  - override /callbacks: default
  # NEW: Use 16bit mixed precision training
  - override /trainer: gpu_16bit
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 2000
  # NEW: Increase the batch size to 128 (we accumulate 2 batches)
  accumulate_grad_batches: 2

logger:
  tags: ${tags}
  group: "cpc"
  name: "03_500m_parameters"

data:
  batch_size: 64
  num_workers: 6
  val_dataset_seed: 42
  samples_per_trajectory: 96
  bottom_bar_censor_ratio: 0.5

callbacks:
  model_checkpoint:
    # Instead of early stopping, we save more checkpoints
    save_top_k: 5
    # NEW: monitor validation loss instead of accuracy, as the accuracy can peak while the loss still decreases (higher confidence)
    monitor: "val_loss"
    mode: "min"

# NEW: Speedup training by using high float precision
float32_matmul_precision: "high"
# NEW: Reduce context length to 64, as the model is very large
context_length: 64
