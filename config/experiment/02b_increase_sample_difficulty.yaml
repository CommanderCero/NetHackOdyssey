# @package _global_

defaults:
  - override /data: cpc
  - override /model: cpc
  - override /callbacks: default
  - override /trainer: gpu
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 1000

logger:
  tags: ${tags}
  group: "cpc"
  name: "02b_increase_sample_difficulty_run"

data:
  batch_size: 64
  num_workers: 7
  # Add a seed to ensure we return the same validation data each epoch
  val_dataset_seed: 42
  # NEW: Increase the samples per trajectory.
  # NEW: This should make it more difficult due to the environment often looking very similiar
  # NEW: Hopefully resulting in better embeddings that focus on tiny details
  samples_per_trajectory: 48
  # NEW: Partially censor the bottom bar to force the model to learn more about the environment
  # NEW: As the player name, time, and score could be easily used to distinguish between trajectories
  bottom_bar_censor_ratio: 0.5

# By default we use val_accuracy, but it seems to make more sense to use val_loss
# As accuracy could converge while loss is still decreasing (Aka model is learning to be more confident)
early_stopping:
  monitor: "val_loss"
  mode: "min"