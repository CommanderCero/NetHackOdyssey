# @package _global_
defaults:
  - override /data: cpc
  - override /model: cpc
  - override /callbacks: default
  - override /trainer: gpu_16bit
  - override /paths: apocrita
  - override /logger: wandb

logger:
  tags: ${tags}
  group: "cpc"
  name: "05_50m_optimizations"

# NEW: Use AdamW optimizer with weight decay
# NEW: Compile the model for performance improvements
model:
  optimizer_fn:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 2e-4
    weight_decay: 1e-2

  compile: true

trainer:
  min_epochs: 10
  max_epochs: 2000

data:
  batch_size: 64
  num_workers: 2
  val_dataset_seed: 42
  samples_per_trajectory: 48
  bottom_bar_censor_ratio: 0.5

callbacks:
  model_checkpoint:
    save_top_k: 5
    monitor: "val_loss"
    mode: "min"

float32_matmul_precision: "high"
