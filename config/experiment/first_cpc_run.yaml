# @package _global_

defaults:
  - override /data: cpc
  - override /model: cpc
  - override /callbacks: default
  - override /trainer: gpu
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 1000

data:
  batch_size: 64
  num_workers: 4

logger:
  tags: ${tags}
  group: "cpc"
  name: "first_cpc_run"