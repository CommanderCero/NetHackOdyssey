# @package _global_

defaults:
  - override /data: cpc
  - override /model: cpc
  - override /callbacks: default
  - override /trainer: gpu
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 1000

logger:
  tags: ${tags}
  group: "cpc"
  name: "02a_improve_validation_run"

data:
  batch_size: 64
  num_workers: 7
  # NEW: Add a seed to ensure we return the same validation data each epoch
  val_dataset_seed: 42

# NEW: By default we use val_accuracy, but it seems to make more sense to use val_loss
# NEW: As accuracy could converge while loss is still decreasing (Aka model is learning to be more confident)
early_stopping:
  monitor: "val_loss"
  mode: "min"