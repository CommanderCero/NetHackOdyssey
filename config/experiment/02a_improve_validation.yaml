# @package _global_

defaults:
  - override /data: cpc
  - override /model: cpc
  - override /callbacks: default
  - override /trainer: gpu
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 2000

logger:
  tags: ${tags}
  group: "cpc"
  name: "02a_improve_validation"

data:
  batch_size: 64
  num_workers: 7
  # NEW: Add a seed to ensure we return the same validation data each epoch
  val_dataset_seed: 42

callbacks:
  model_checkpoint:
    # Instead of early stopping, we save more checkpoints
    save_top_k: 5