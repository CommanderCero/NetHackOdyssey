# @package _global_

# Our 500M parameter model was too ambitious, it takes too long to train and quickly resulted in NaN values.
# So lets use only 50M parameters, and check if any of the changes cause the model to diverge.
# For this experiment we only use 16bit precision training.

defaults:
  - override /data: cpc
  - override /model: cpc_50m
  - override /callbacks: default
  - override /trainer: gpu_16bit
  - override /paths: apocrita
  - override /logger: wandb

trainer:
  min_epochs: 10
  max_epochs: 2000

logger:
  tags: ${tags}
  group: "cpc"
  name: "04_50m_16bit_only"

data:
  batch_size: 64
  num_workers: 6
  val_dataset_seed: 42
  samples_per_trajectory: 96
  bottom_bar_censor_ratio: 0.5

callbacks:
  model_checkpoint:
    # Instead of early stopping, we save more checkpoints
    save_top_k: 5
    # monitor validation loss instead of accuracy, as the accuracy can peak while the loss still decreases (higher confidence)
    monitor: "val_loss"
    mode: "min"

# Speedup training by using high float precision
# float32_matmul_precision: "high"
