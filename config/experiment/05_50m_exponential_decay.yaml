# @package _global_
defaults:
  - override /data: cpc
  - override /model: cpc_50m
  - override /callbacks: default
  - override /trainer: gpu_16bit
  - override /paths: apocrita
  - override /logger: wandb

logger:
  tags: ${tags}
  group: "cpc"
  name: "05_50m_exponential_decay"

# NEW: Use AdamW optimizer with weight decay
# NEW: Use Cosine Annealing scheduler
# NEW: Start with a learning rate of 3e-4
# NEW: Compile the model for performance improvements
model:
  optimizer_fn:
    _target_: torch.optim.AdamW
    _partial_: true
    weight_decay: 1e-2

  scheduler_fn:
    _target_: torch.optim.lr_scheduler.ExponentialLR
    _partial_: true
    # Should decay the learning rate to around 1e-6 over 4000 epochs
    gamma: 0.998575

  lr: 3e-4
  compile: true

trainer:
  max_epochs: 4000

data:
  batch_size: 64
  num_workers: 2
  val_dataset_seed: 42
  samples_per_trajectory: 48
  bottom_bar_censor_ratio: 0.5

callbacks:
  model_checkpoint:
    save_top_k: 5
    monitor: "val_loss"
    mode: "min"

float32_matmul_precision: "high"
