# @package _global_
defaults:
  # NEW: Use the mini dataset for a quick overfitting test
  - override /data: mini_cpc
  - override /model: cpc_50m
  - override /callbacks: default
  - override /trainer: gpu_16bit
  - override /paths: apocrita
  - override /logger: wandb

logger:
  tags: ${tags}
  group: "cpc"
  name: "05_50m_exponential_decay"

model:
  optimizer_fn:
    _target_: torch.optim.AdamW
    _partial_: true
    weight_decay: 1e-2

  lr: 2e-4
  compile: true

trainer:
  max_epochs: 4000

data:
  batch_size: 64
  num_workers: 2
  val_dataset_seed: 42
  samples_per_trajectory: 48
  bottom_bar_censor_ratio: 0.5

callbacks:
  model_checkpoint:
    save_top_k: 5
    monitor: "val_loss"
    mode: "min"

float32_matmul_precision: "high"
